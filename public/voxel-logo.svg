<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2CFF"/>
      <stop offset="50%" stop-color="#FF2C91"/>
      <stop offset="100%" stop-color="#FF8A34"/>
    </linearGradient>
    <linearGradient id="oGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2CFF"/>
      <stop offset="55%" stop-color="#FF2C91"/>
      <stop offset="100%" stop-color="#FF8A34"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2C91"/>
      <stop offset="100%" stop-color="#FF8A34"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="8" y="8" width="496" height="496" rx="88" ry="88" fill="#08040c" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Soft outer glow ring -->
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.35" filter="url(#glow)"/>

  <!-- VOXel wordmark -->
  <g transform="translate(76, 210)">
    <!-- V -->
    <text x="0" y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="132" font-weight="800" fill="#ffffff" letter-spacing="-2">V</text>

    <!-- O with play triangle -->
    <g transform="translate(88, -98)">
      <circle cx="60" cy="60" r="58" fill="url(#oGrad)"/>
      <circle cx="60" cy="60" r="58" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
      <polygon points="48,34 48,86 90,60" fill="#ffffff" points-origin="center"/>
    </g>

    <!-- X -->
    <text x="214" y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="132" font-weight="800" fill="#ffffff" letter-spacing="-2">X</text>

    <!-- el -->
    <text x="314" y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="132" font-weight="700" fill="url(#textGrad)" letter-spacing="-1">el</text>
  </g>

  <!-- Tagline -->
  <text x="256" y="390" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="600" fill="url(#textGrad)" letter-spacing="3">CREATE. CONNECT. EARN.</text>
</svg>
